name: Rust Principles Enforcement

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    formatting:
        name: Check Code Formatting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust toolchain with rustfmt
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Run cargo fmt --all -- --check
              run: cargo fmt --all -- --check
              
    clippy-pedantic:
        name: Clippy Pedantic Lints
        needs: cargo-check
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
    
          - name: Install Rust toolchain with Clippy
            uses: dtolnay/rust-toolchain@stable
            with:
              components: clippy
    
          - name: Cache Cargo dependencies
            uses: Swatinem/rust-cache@v2
    
          - name: Run Clippy Pedantic (Enforce Zero Warnings)
            run: cargo clippy --workspace --all-targets -- -W clippy::pedantic -D warnings
