name: Rust Principles Enforcement

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    # Principle: rustfmt & cargo fmt --all
    formatting:
        name: Check Code Formatting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust toolchain with rustfmt
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Run cargo fmt --all -- --check
              run: cargo fmt --all -- --check

    # Principle: No unsafe
    no-unsafe:
        name: Forbid Unsafe Code
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Install cargo-geiger
              run: cargo install cargo-geiger
            - name: Verify zero unsafe code usage
              run: |
                  # Fails build if any unsafe code is detected in the workspace
                  cargo geiger --forbid-unsafe-code

    # Principle: Every public item carries doc comments & No undocumented panics
    documentation-and-panics:
        name: Verify Docs & Panic Warnings
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust toolchain with clippy
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Check for missing documentation & unhandled panics
              env:
                  RUSTDOCFLAGS: "-D missing_docs -D warnings"
              run: |
                  # 1. Reject missing doc comments on public items
                  cargo doc --no-deps --workspace

                  # 2. Flag panicking functions (unwrap, expect, indexing, etc.)
                  cargo clippy --all-targets -- -D clippy::indexing_slicing -D clippy::unwrap_used -D clippy::panic -D clippy::expect_used
