name: "Auto-Label & Assign"

on:
    pull_request:
        types: [opened, synchronize]
    issues:
        types: [opened, labeled]

jobs:
    label-pr:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/labeler@v5
              with:
                  repo-token: "${{ secrets.GITHUB_TOKEN }}"
                  configuration-path: .github/labeler-config.yml

    label-issue-from-form:
        if: github.event_name == 'issues' && github.event.action == 'opened'
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - name: Parse issue body and apply label
              uses: actions/github-script@v7
              with:
                  script: |
                      const body = context.payload.issue.body || '';

                      // Extract the selection under ### feature or similar markdown heading rendered by GitHub Forms
                      const match = body.match(/###\s*feature\s*\n+([^\n\r]+)/i);

                      if (match && match[1]) {
                        const selectedFeature = match[1].trim().toLowerCase();

                        let labelToAdd = null;
                        if (selectedFeature.includes('geometry')) {
                          labelToAdd = 'geometry';
                        } else if (selectedFeature.includes('types')) {
                          labelToAdd = 'types';
                        }

                        if (labelToAdd) {
                          await github.rest.issues.addLabels({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.issue.number,
                            labels: [labelToAdd]
                          });
                          console.log(`Added label '${labelToAdd}' to issue #${context.issue.number}`);
                        } else {
                          console.log(`No matching label found for selected value: '${selectedFeature}'`);
                        }
                      } else {
                        console.log("Could not find 'feature' dropdown field in issue body.");
                      }

    assign-issue-team:
        needs: [label-issue-from-form]
        if: always() && github.event_name == 'issues'
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - name: Fetch Fresh Labels, Assign Team Members, and Mention Team
              uses: actions/github-script@v7
              with:
                  script: |
                      const org = 'SharedCode-UniTn-AP-2026';

                      // Team mapping and member assignees
                      const teamMapping = {
                        'geometry': { teamSlug: 'red', members: ['PedroniMichele'] },
                        'types': { teamSlug: 'blue', members: ['09tommy05'] }
                      };

                      // Fetch the latest issue details to get fresh labels
                      const { data: issue } = await github.rest.issues.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number
                      });

                      const labelNames = issue.labels.map(l => l.name.toLowerCase());
                      console.log(`Current labels on issue #${context.issue.number}:`, labelNames);

                      for (const [label, teamConfig] of Object.entries(teamMapping)) {
                        if (labelNames.includes(label)) {
                          const { teamSlug, members } = teamConfig;
                          const assignees = members.map(m => m.trim()).filter(Boolean);

                          // Assign users to the issue
                          if (assignees.length > 0) {
                            await github.rest.issues.addAssignees({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              assignees: assignees
                            });
                            console.log(`Assigned users for label '${label}': ${assignees.join(', ')}`);
                          }

                          // Post team notification comment
                          await github.rest.issues.createComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.issue.number,
                            body: `Hello @${org}/${teamSlug}, this issue has been automatically assigned to your team.`
                          });
                          console.log(`Posted team mention comment for @${org}/${teamSlug}`);
                        }
                      }
